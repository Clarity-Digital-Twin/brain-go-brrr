[importlinter]
root_package = brain_go_brrr

# Clean Architecture: Domain Layer (innermost - no dependencies)
[importlinter:contract:domain_pure]
name = Domain must be pure (no outer dependencies)
type = forbidden
source_modules =
    brain_go_brrr.domain
forbidden_modules =
    brain_go_brrr.application
    brain_go_brrr.infra
    brain_go_brrr.api
    brain_go_brrr.presentation
    brain_go_brrr.services
    brain_go_brrr.core
ignore_imports =
    brain_go_brrr._typing
    brain_go_brrr.domain -> brain_go_brrr.domain

# Clean Architecture: Application Layer (depends only on Domain)
[importlinter:contract:application_clean]
name = Application depends only on Domain
type = forbidden
source_modules =
    brain_go_brrr.application
forbidden_modules =
    brain_go_brrr.infra
    brain_go_brrr.api
    brain_go_brrr.presentation
    brain_go_brrr.services
ignore_imports =
    brain_go_brrr.application -> brain_go_brrr.domain
    brain_go_brrr.application -> brain_go_brrr.application

# Clean Architecture: Infrastructure Layer (implements interfaces)
[importlinter:contract:infra_boundaries]
name = Infrastructure must not import API/Presentation
type = forbidden
source_modules =
    brain_go_brrr.infra
forbidden_modules =
    brain_go_brrr.api
    brain_go_brrr.presentation
ignore_imports =
    brain_go_brrr.infra -> brain_go_brrr.domain
    brain_go_brrr.infra -> brain_go_brrr.application
    brain_go_brrr.infra -> brain_go_brrr.infra

# Clean Architecture: API/Presentation Layer (outermost)
[importlinter:contract:layers]
name = Clean Architecture Layers (outside-in)
type = layers
layers =
    brain_go_brrr.api
    brain_go_brrr.presentation
    brain_go_brrr.infra
    brain_go_brrr.application
    brain_go_brrr.domain

# Compatibility shims should be isolated
[importlinter:contract:no_core_imports]
name = No imports from deprecated core/services (except shims)
type = forbidden
source_modules =
    brain_go_brrr.domain
    brain_go_brrr.application
    brain_go_brrr.infra
    brain_go_brrr.api
    brain_go_brrr.presentation
forbidden_modules =
    brain_go_brrr.core
    brain_go_brrr.services
    brain_go_brrr.models
    brain_go_brrr.preprocessing
    brain_go_brrr.visualization
    brain_go_brrr.config