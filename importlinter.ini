[importlinter]
root_package = brain_go_brrr

[importlinter:contract:1]
name = Domain must not depend on Application, Infrastructure, or Presentation
type = forbidden
source_modules =
    brain_go_brrr.domain
forbidden_modules =
    brain_go_brrr.application
    brain_go_brrr.infra
    brain_go_brrr.api
    brain_go_brrr.presentation

[importlinter:contract:2]
name = Application depends only on Domain (not Infrastructure or Presentation)
type = forbidden
source_modules =
    brain_go_brrr.application
forbidden_modules =
    brain_go_brrr.infra
    brain_go_brrr.api
    brain_go_brrr.presentation

[importlinter:contract:3]
name = Infrastructure depends only on Domain and Application
type = forbidden
source_modules =
    brain_go_brrr.infra
forbidden_modules =
    brain_go_brrr.api
    brain_go_brrr.presentation

[importlinter:contract:4]
name = API/Presentation is the top layer
type = forbidden
source_modules =
    brain_go_brrr.domain
    brain_go_brrr.application
    brain_go_brrr.infra
forbidden_modules =
    brain_go_brrr.api
    brain_go_brrr.presentation

[importlinter:contract:5]
name = Compatibility shims are isolated
type = forbidden
source_modules =
    brain_go_brrr.domain
    brain_go_brrr.application
    brain_go_brrr.infra
    brain_go_brrr.api
    brain_go_brrr.presentation
forbidden_modules =
    brain_go_brrr.core
    brain_go_brrr.services