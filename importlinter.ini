[importlinter]
root_package = brain_go_brrr

[importlinter:contract:1]
name = Core must not depend on Infrastructure
type = forbidden
source_modules =
    brain_go_brrr.core
forbidden_modules =
    brain_go_brrr.infra
    brain_go_brrr.api

[importlinter:contract:2]
name = Domain logic should be pure
type = forbidden
source_modules =
    brain_go_brrr.core.abnormal
    brain_go_brrr.core.sleep
    brain_go_brrr.core.quality
forbidden_modules =
    brain_go_brrr.infra
    brain_go_brrr.api
    brain_go_brrr.services
    brain_go_brrr.tasks

[importlinter:contract:3]
name = Models should not depend on API or Services
type = forbidden
source_modules =
    brain_go_brrr.models
forbidden_modules =
    brain_go_brrr.api
    brain_go_brrr.services
    brain_go_brrr.tasks

[importlinter:contract:4]
name = API is the top layer - nothing depends on it
type = forbidden
source_modules =
    brain_go_brrr.core
    brain_go_brrr.models
    brain_go_brrr.preprocessing
    brain_go_brrr.data
    brain_go_brrr.services
    brain_go_brrr.tasks
    brain_go_brrr.training
    brain_go_brrr.utils
    brain_go_brrr.visualization
forbidden_modules =
    brain_go_brrr.api