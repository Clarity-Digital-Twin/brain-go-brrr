# Pre-commit hooks for Clean Architecture enforcement
# Install with: pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # Ruff - Fast Python linter and formatter (aligned with CI/local)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6  # Match the version used in development
    hooks:
      - id: ruff
        args: [--fix]
        exclude: ^(archive/|scripts/archive/|reference_repos/)
      - id: ruff-format
        exclude: ^(archive/|scripts/archive/|reference_repos/)

  # Type checking with mypy (temporarily disabled - pydantic issue)
  # - repo: https://github.com/pre-commit/mirrors-mypy
  #   rev: v1.10.0
  #   hooks:
  #     - id: mypy
  #       additional_dependencies:
  #         - types-requests
  #         - types-redis
  #         - numpy
  #       args: [--ignore-missing-imports, --no-strict-optional]
  #       files: ^src/brain_go_brrr/
  #       exclude: ^(tests|archive|reference_repos)/

  # Architecture enforcement
  - repo: local
    hooks:
      # Import-linter for Clean Architecture (temporarily disabled - command not found)
      # - id: import-linter
      #   name: import-linter
      #   entry: bash -c 'lint-imports --verbosity 1'
      #   language: system
      #   pass_filenames: false
      #   always_run: true

      # Domain purity check
      - id: domain-pure
        name: domain-pure
        entry: bash -c 'if git grep -nE "from brain_go_brrr\.(infra|application|api|presentation)" src/brain_go_brrr/domain | grep -v "detector.py" | grep -v "controller.py" | grep -v "extractor.py"; then echo "❌ Domain has outer dependencies!"; exit 1; fi'
        language: system
        pass_filenames: false
        always_run: true

      # Infrastructure independence
      - id: infra-independent
        name: infra-independent
        entry: bash -c 'if git grep -nE "from brain_go_brrr\.(api|presentation|application)" src/brain_go_brrr/infra; then echo "❌ Infrastructure depends on outer layers!"; exit 1; fi'
        language: system
        pass_filenames: false
        always_run: true

      # Core utilities independence (temporarily disabled - fixing imports)
      # - id: core-independent
      #   name: core-independent
      #   entry: bash -c 'if git grep -nE "from brain_go_brrr\.(domain|application|infra|api)" src/brain_go_brrr/core; then echo "❌ Core has dependencies!"; exit 1; fi'
      #   language: system
      #   pass_filenames: false
      #   always_run: true

  # Security checks (temporarily disabled - missing baseline)
  # - repo: https://github.com/Yelp/detect-secrets
  #   rev: v1.4.0
  #   hooks:
  #     - id: detect-secrets
  #       args: ['--baseline', '.secrets.baseline']

  # YAML validation
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ['--maxkb=5000']
      - id: check-merge-conflict
      - id: check-toml
