# Pre-commit hooks for Clean Architecture enforcement
# Install with: pre-commit install
# Run manually: pre-commit run --all-files

# Global exclusions
exclude: '^literature/.*'

repos:
  # Ruff - Fast Python linter and formatter (aligned with CI/local)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.3  # MUST match uv.lock version that CI uses!
    hooks:
      - id: ruff
        args: [--fix]
        files: ^(src|tests|scripts|experiments)/
        exclude: ^(archive/|scripts/archive/|tests/archive/|reference_repos/|notebooks/|research/|literature/)
      - id: ruff-format
        files: ^(src|tests|scripts|experiments)/
        exclude: ^(archive/|scripts/archive/|tests/archive/|reference_repos/|notebooks/|research/|literature/)

  # Type checking with mypy - Using fast config for pre-commit
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: bash -c 'if [ "$#" -gt 0 ]; then timeout 30 uv run mypy --config-file=mypy-fast.ini "$@"; else echo "No files to check"; fi'
        language: system
        files: ^(src/brain_go_brrr)/.*\.py$
        exclude: ^(tests|archive|reference_repos|experiments)/
        pass_filenames: true
        require_serial: true

  # Architecture enforcement
  - repo: local
    hooks:
      # Import-linter for Clean Architecture (temporarily disabled - command not found)
      # - id: import-linter
      #   name: import-linter
      #   entry: bash -c 'lint-imports --verbosity 1'
      #   language: system
      #   pass_filenames: false
      #   always_run: true

      # Domain purity check
      - id: domain-pure
        name: domain-pure
        entry: bash -c 'if git grep -nE "from brain_go_brrr\.(infra|application|api|presentation)" src/brain_go_brrr/domain | grep -v "detector.py" | grep -v "controller.py" | grep -v "extractor.py"; then echo "❌ Domain has outer dependencies!"; exit 1; fi'
        language: system
        pass_filenames: false
        always_run: true

      # Infrastructure independence
      - id: infra-independent
        name: infra-independent
        entry: bash -c 'if git grep -nE "from brain_go_brrr\.(api|presentation|application)" src/brain_go_brrr/infra; then echo "❌ Infrastructure depends on outer layers!"; exit 1; fi'
        language: system
        pass_filenames: false
        always_run: true

      # Core utilities independence (temporarily disabled - fixing imports)
      # - id: core-independent
      #   name: core-independent
      #   entry: bash -c 'if git grep -nE "from brain_go_brrr\.(domain|application|infra|api)" src/brain_go_brrr/core; then echo "❌ Core has dependencies!"; exit 1; fi'
      #   language: system
      #   pass_filenames: false
      #   always_run: true

      # CRITICAL: Prevent parallel implementations (the AUROC=0.50 disaster)
      - id: no-parallel-impl
        name: no-parallel-implementations
        entry: .ci/check_no_parallel_impl.sh
        language: script
        pass_filenames: false
        always_run: true
        files: ^experiments/.*\.py$

      # Prevent sys.path.insert hacks
      - id: no-sys-path
        name: no-sys-path-insert
        entry: bash -c 'if grep -r "sys\.path\.insert" experiments/ --include="*.py" 2>/dev/null | grep -v "^#"; then echo "❌ sys.path.insert found in experiments!"; exit 1; fi || echo "✅ No sys.path hacks"'
        language: system
        pass_filenames: false
        always_run: true

      # Check for unsafe torch.load usage (prevent CI/CD failures)
      - id: safe-torch-load
        name: safe-torch-load
        entry: uv run python .pre-commit-hooks/safe_torch_load.py
        language: system
        files: ^(src|tests|experiments)/.*\.py$
        exclude: safe_load.py

      # Check for hardcoded dataset paths (prevent Sleep-EDF regression)
      - id: no-hardcoded-paths
        name: no-hardcoded-paths
        entry: python .pre-commit-hooks/check_hardcoded_paths.py
        language: python
        files: \.(py|md|rst|txt|sh)$
        exclude: ^(SLEEP_EDF_FIX_PLAN|PATH_AUDIT|CLEANUP_STATUS|DIVERGENCE_FIX|TEST_DATA_DIVERGENCE|CACHE_PATH_ANALYSIS)\.md$
        additional_dependencies: []

      # Detect duplicate class definitions
      - id: duplicate-classes
        name: duplicate-classes
        entry: python .pre-commit-hooks/check-duplicate-classes.py
        language: python
        pass_filenames: false
        always_run: true
        additional_dependencies: []

  # Security checks (temporarily disabled - missing baseline)
  # - repo: https://github.com/Yelp/detect-secrets
  #   rev: v1.4.0
  #   hooks:
  #     - id: detect-secrets
  #       args: ['--baseline', '.secrets.baseline']

  # YAML validation
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ['--maxkb=5000']
      - id: check-merge-conflict
      - id: check-toml
