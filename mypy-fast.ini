[mypy]
python_version = 3.11
files = src/brain_go_brrr
strict = False
warn_return_any = False
warn_unused_configs = True
ignore_missing_imports = True
follow_imports = skip
disallow_untyped_defs = False
check_untyped_defs = False

# Fast mode settings
incremental = True
cache_dir = .mypy_cache_fast
show_error_codes = True
pretty = True
