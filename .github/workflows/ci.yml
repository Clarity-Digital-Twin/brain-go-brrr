name: CI/CD Pipeline

# Branch Strategy:
# - development: Quick tests only (make test)
# - staging: Standard tests + basic security
# - main: Full suite + integration + benchmarks + security + multi-Python
#
# This prevents redundancy and speeds up CI while maintaining quality gates

on:
  push:
    branches: [main, staging, development]
  pull_request:
    branches: [main, staging, development]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

env:
  PYTHON_VERSION: "3.11"
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: 1
  BGBR_DISABLE_YASA: 1

jobs:
  # ============================================
  # CHANGE DETECTION - Determine what needs to run
  # ============================================
  changes:
    name: Detect Changes 🔍
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}

    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'tests/**'
              - 'scripts/**'
              - '*.py'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/**'
            docs:
              - '**/*.md'
              - 'docs/**'
              - 'literature/**'

  # ============================================
  # STAGE 1: QUALITY GATES (Always Run, Fail Fast)
  # ============================================
  quality:
    name: Code Quality ✨
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen --dev  # Install all dev dependencies

      - name: Show tool versions (for debugging)
        run: |
          echo "Python version:"
          python --version
          echo "Ruff version:"
          uv run ruff --version
          echo "MyPy version:"
          uv run mypy --version

      - name: Format check (no auto-fix)
        run: |
          echo "Checking code formatting..."
          uv run ruff format --check --diff src/ tests/ scripts/ experiments/

      - name: Lint check (no auto-fix)
        run: |
          echo "Running linter checks..."
          uv run ruff check src/ tests/ scripts/ experiments/

      - name: Type checking (MyPy)
        run: |
          echo "Running type checks..."
          uv run mypy --config-file mypy.ini src/brain_go_brrr

      - name: Import infra.ml_models without warnings
        run: |
          echo "Importing infra.ml_models with DeprecationWarnings treated as errors..."
          uv run python -W error::DeprecationWarning -c "import brain_go_brrr.infra.ml_models; print('ok')"

      - name: Import linter (architecture contracts)
        run: |
          echo "Running import-linter contracts..."
          uv run lint-imports
          echo "Import-linter completed"

      - name: Import smoke test
        run: |
          uv run python -c "from brain_go_brrr.domain.exceptions import BrainGoBrrrError; print('✅ All imports work')"
      
      - name: Import performance guard
        run: |
          echo "Checking import time (max 3 seconds)..."
          uv run python -c "
import time
start = time.perf_counter()
import brain_go_brrr
elapsed = time.perf_counter() - start
print(f'Import took {elapsed:.2f}s')
if elapsed > 3.0:
    print(f'ERROR: Import too slow ({elapsed:.2f}s > 3.0s)')
    exit(1)
print('✅ Import performance OK')
          "

      - name: Check unsafe torch.load
        run: |
          echo "Checking for unsafe torch.load usage..."
          uv run python .pre-commit-hooks/safe_torch_load.py $(find src tests experiments -name "*.py" | grep -v safe_load.py)

      - name: Check for parallel implementations (CRITICAL)
        run: |
          echo "Checking for architecture drift..."
          .ci/check_no_parallel_impl.sh

      - name: Check no sys.path.insert
        run: .ci/check_no_sys_path.sh

      - name: Check no Lightning imports
        run: .ci/check_no_lightning.sh

      - name: Check experiments are shims
        run: .ci/check_experiments_shims.sh

      - name: Check META schema compliance
        run: .ci/check_meta_schema.sh

      - name: Check channels SSOT
        run: .ci/check_channels_ssot.sh

      - name: Check no legacy compat code
        run: .ci/check_no_compat.sh

  # ============================================
  # STAGE 2: TESTING (After Quality Passes)
  # ============================================
  test:
    name: Test Suite 🧪
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils fonts-dejavu-core

      # DEVELOPMENT & PR: Quick tests only
      - name: Run quick tests
        if: github.ref == 'refs/heads/development' || github.event_name == 'pull_request'
        env:
          PYTHONWARNINGS: "error"  # Treat warnings as errors
        run: |
          echo "Running fast tests with warnings as errors..."
          make test

      # MAIN/STAGING: Full test suite with coverage
      - name: Run full tests with coverage
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
        env:
          PYTHONWARNINGS: "error"  # Treat warnings as errors
        run: |
          echo "Running full test suite with coverage and warnings as errors..."
          make test-all-cov

      # Coverage upload disabled (using make test without coverage for now)
      # - name: Upload coverage
      #   if: (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main') && always()
      #   uses: codecov/codecov-action@v4
      #   with:
      #     file: ./coverage.xml
      #     flags: unittests
      #     name: codecov-ubuntu-${{ env.PYTHON_VERSION }}
      #     fail_ci_if_error: false  # Don't fail if upload fails

  # REMOVED: Pointless matrix testing for single Python version
  # Was testing only Python 3.12, now handled in main test job

  # ============================================
  # STAGE 4: SECURITY (Main Only - staging gets basic quality checks)
  # ============================================
  security:
    name: Security Scan 🔒
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main'  # Only deep scan on main

    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run pip-audit
        run: |
          echo "Running pip-audit for known vulnerabilities..."
          uv run pip-audit --desc || true  # Don't fail build on vulnerabilities yet

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'  # Don't fail the build on vulnerabilities

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: always() && github.actor != 'dependabot[bot]'
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true  # Don't fail if upload fails

  # ============================================
  # STAGE 5: INTEGRATION (Staging & Main Only)
  # ============================================
  integration:
    name: Integration Tests 🔄
    needs: test  # Security is optional, runs in parallel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.ref == 'refs/heads/main'  # Only run on main, not staging

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run integration tests
        env:
          REDIS_URL: redis://localhost:6379
        run: |
          # Check if make target exists, fallback to direct pytest
          if make -n test-integration >/dev/null 2>&1; then
            make test-integration
          else
            echo "Running integration tests directly..."
            env PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 BGBR_DISABLE_YASA=1 uv run pytest -p pytest_timeout tests \
              -m "integration and not gpu and not data and not requires_model" \
              --run-integration \
              -v \
              --tb=short \
              -o addopts="" || echo "Integration tests not available"
          fi

  # ============================================
  # STAGE 6: BENCHMARKS (Main Only)
  # ============================================
  benchmarks:
    name: Performance Benchmarks 📊
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'  # Only on direct push to main

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need history for comparison

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run benchmarks
        env:
          CI_BENCHMARKS: "0"
        run: |
          # Run benchmarks - FAIL if they regress
          if make -n test-benchmarks >/dev/null 2>&1; then
            make test-benchmarks
          else
            env PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 uv run pytest -p benchmark tests/benchmarks \
              -m "not gpu" \
              --benchmark-only \
              --benchmark-json=benchmark_results.json \
              -xvs \
              --tb=short
          fi

      - name: Upload benchmark results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark_results.json
          retention-days: 30

  # ============================================
  # STAGE 7: BUILD & DEPLOY (Main Only)
  # ============================================
  build:
    name: Build & Package 📦
    needs: test  # Removed test-matrix dependency
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Build package
        run: |
          uv build
          ls -la dist/

      - name: Build documentation
        run: |
          uv sync --all-extras
          make docs || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # ============================================
  # FINAL: Status Check
  # ============================================
  ci-status:
    name: CI Status ✅
    runs-on: ubuntu-latest
    needs: [changes, quality, test]
    if: always()

    steps:
      - name: Check CI Status
        run: |
          echo "Code changes: ${{ needs.changes.outputs.code }}"
          echo "Docs changes: ${{ needs.changes.outputs.docs }}"

          # If only docs changed, pass immediately
          if [[ "${{ needs.changes.outputs.code }}" != "true" ]]; then
            echo "✅ Docs-only change - CI Passed"
            exit 0
          fi

          # If code changed, check that tests passed
          if [[ "${{ needs.quality.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "❌ CI Failed"
            echo "Quality: ${{ needs.quality.result }}"
            echo "Test: ${{ needs.test.result }}"
            exit 1
          fi
          echo "✅ CI Passed"
