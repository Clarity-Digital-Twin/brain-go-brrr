# CI/CD Pipeline for Brain Go Brrr
# Simplified for current development stage

name: CI/CD Pipeline

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  UV_VERSION: "0.8.1"
  PYTHONPATH: src  # Belt & suspenders for imports

jobs:
  # Code quality and linting
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync

      - name: Install package in editable mode
        run: uv pip install -e .

      - name: Quick import smoke test
        run: |
          uv run python - <<'PY'
          import sys
          # Just test that the basic package structure is importable
          try:
              import brain_go_brrr
              print("✓ brain_go_brrr package imported")

              # Test core modules exist
              from brain_go_brrr.application.config import base
              print("✓ application.config.base found")

              from brain_go_brrr.core import exceptions
              print("✓ core.exceptions found")

              # Check that infra subpackages exist as directories
              import os
              src_dir = os.path.dirname(brain_go_brrr.__file__)
              if os.path.exists(os.path.join(src_dir, "infra", "data", "__init__.py")):
                  print("✓ infra.data package exists")
              else:
                  print("✗ infra.data package missing")
                  sys.exit(1)

              print("\n✅ Package structure verified!")
          except ImportError as e:
              print(f"✗ Import failed: {e}")
              sys.exit(1)
          PY

      - name: Run formatting check
        run: make format-check

      - name: Run linting
        run: make lint-ci

      - name: Run type checking
        run: make type-check || true  # Allow to fail for now

      # Security and docstring checks removed - not in project dependencies

  # Testing on primary platform
  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: quality
    timeout-minutes: 15  # Generous timeout for entire job
    env:
      PYTHONPATH: src  # Ensure imports work correctly
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils fonts-dejavu-core

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run unit tests
        run: make test-unit
        timeout-minutes: 10

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.python-version }}
          path: |
            htmlcov/
            coverage.xml

  # Security scanning
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  # Documentation build
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Build documentation
        run: make docs

      - name: Upload documentation
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: site/
