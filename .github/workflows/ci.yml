name: CI/CD Pipeline

# Branch Strategy:
# - development: Quick tests only (make test)
# - staging: Standard tests + basic security
# - main: Full suite + integration + benchmarks + security + multi-Python
#
# This prevents redundancy and speeds up CI while maintaining quality gates

on:
  push:
    branches: [main, staging, development]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'archive/**'
  pull_request:
    branches: [main, staging, development]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

env:
  PYTHON_VERSION: "3.11"
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: 1
  BGBR_DISABLE_YASA: 1

jobs:
  # ============================================
  # STAGE 1: QUALITY GATES (Always Run, Fail Fast)
  # ============================================
  quality:
    name: Code Quality ✨
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Pre-commit hooks
        run: |
          pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure

      - name: Ruff linting & formatting
        run: |
          make format-check
          make lint-ci

      - name: Type checking (MyPy)
        run: make type-check || true  # Allow failures for third-party issues

      - name: Import smoke test
        run: |
          uv run python -c "from brain_go_brrr.domain.exceptions import BrainGoBrrrError; print('✅ All imports work')"

      - name: Check unsafe torch.load
        run: |
          echo "Checking for unsafe torch.load usage..."
          python .pre-commit-hooks/safe_torch_load.py $(find src tests -name "*.py" | grep -v safe_load.py)

  # ============================================
  # STAGE 2: TESTING (After Quality Passes)
  # ============================================
  test:
    name: Test Suite 🧪
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils fonts-dejavu-core

      # DEVELOPMENT: Quick tests only
      - name: Run quick tests (development)
        if: github.ref == 'refs/heads/development'
        run: |
          echo "Running fast tests using Makefile..."
          make test

      # STAGING: Standard tests with coverage
      - name: Run standard tests with coverage (staging)
        if: github.ref == 'refs/heads/staging'
        run: |
          echo "Running test suite with coverage..."
          make test-all-cov

      # MAIN: Full test suite with coverage
      - name: Run full tests with coverage (main)
        if: github.ref == 'refs/heads/main'
        run: |
          echo "Running full test suite with coverage..."
          make test-all-cov

      # PR: Standard tests
      - name: Run PR tests
        if: github.event_name == 'pull_request'
        run: |
          echo "Running PR test suite..."
          make test

      # Coverage upload disabled (using make test without coverage for now)
      # - name: Upload coverage
      #   if: (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main') && always()
      #   uses: codecov/codecov-action@v4
      #   with:
      #     file: ./coverage.xml
      #     flags: unittests
      #     name: codecov-ubuntu-${{ env.PYTHON_VERSION }}
      #     fail_ci_if_error: false  # Don't fail if upload fails

  # ============================================
  # STAGE 3: EXTENDED TESTS (Python versions - main only)
  # ============================================
  test-matrix:
    name: Test Python ${{ matrix.python-version }}
    needs: test
    if: github.ref == 'refs/heads/main'  # Only on main, not staging
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]  # Skip 3.13 until scipy supports it

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run tests
        run: make test

  # ============================================
  # STAGE 4: SECURITY (Main Only - staging gets basic quality checks)
  # ============================================
  security:
    name: Security Scan 🔒
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main'  # Only deep scan on main

    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'  # Don't fail the build on vulnerabilities

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: always() && github.actor != 'dependabot[bot]'
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true  # Don't fail if upload fails

  # ============================================
  # STAGE 5: INTEGRATION (Staging & Main Only)
  # ============================================
  integration:
    name: Integration Tests 🔄
    needs: test  # Security is optional, runs in parallel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.ref == 'refs/heads/main'  # Only run on main, not staging

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run integration tests
        env:
          REDIS_URL: redis://localhost:6379
        run: |
          # Check if make target exists, fallback to direct pytest
          if make -n test-integration >/dev/null 2>&1; then
            make test-integration
          else
            echo "Running integration tests directly..."
            env PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 BGBR_DISABLE_YASA=1 uv run pytest -p pytest_timeout tests \
              -m "integration and not gpu and not data and not requires_model" \
              --run-integration \
              -v \
              --tb=short \
              -o addopts="" || echo "Integration tests not available"
          fi

  # ============================================
  # STAGE 6: BENCHMARKS (Main Only)
  # ============================================
  benchmarks:
    name: Performance Benchmarks 📊
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'  # Only on direct push to main

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need history for comparison

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run benchmarks
        env:
          CI_BENCHMARKS: "0"
        run: |
          # Run benchmarks and ensure output file is created
          if make -n test-benchmarks >/dev/null 2>&1; then
            make test-benchmarks || true
          else
            env PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 uv run pytest -p benchmark tests/benchmarks \
              -m "not gpu" \
              --benchmark-only \
              --benchmark-json=benchmark_results.json \
              -xvs \
              --tb=short || true
          fi
          # Ensure benchmark file exists for upload
          touch benchmark_results.json

      - name: Upload benchmark results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark_results.json
          retention-days: 30

  # ============================================
  # STAGE 7: BUILD & DEPLOY (Main Only)
  # ============================================
  build:
    name: Build & Package 📦
    needs: [test, test-matrix]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Build package
        run: |
          uv build
          ls -la dist/

      - name: Build documentation
        run: |
          uv sync --all-extras
          make docs || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # ============================================
  # FINAL: Status Check
  # ============================================
  ci-status:
    name: CI Status ✅
    runs-on: ubuntu-latest
    needs: [quality, test]
    if: always()

    steps:
      - name: Check CI Status
        run: |
          if [[ "${{ needs.quality.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "❌ CI Failed"
            echo "Quality: ${{ needs.quality.result }}"
            echo "Test: ${{ needs.test.result }}"
            exit 1
          fi
          echo "✅ CI Passed"
