name: CI/CD Pipeline

on:
  push:
    branches: [main, staging, development]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'archive/**'
  pull_request:
    branches: [main, staging, development]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

env:
  PYTHON_VERSION: "3.11"
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: 1
  BGBR_DISABLE_YASA: 1

jobs:
  # ============================================
  # STAGE 1: QUALITY GATES (Always Run, Fail Fast)
  # ============================================
  quality:
    name: Code Quality ✨
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Pre-commit hooks
        run: |
          pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure

      - name: Ruff linting & formatting
        run: |
          make format-check
          make lint-ci

      - name: Type checking (MyPy)
        run: make type-check || true  # Allow failures for third-party issues

      - name: Import smoke test
        run: |
          uv run python -c "from brain_go_brrr.domain.exceptions import BrainGoBrrrError; print('✅ All imports work')"

      - name: Check unsafe torch.load
        run: |
          echo "Checking for unsafe torch.load usage..."
          python .pre-commit-hooks/safe_torch_load.py $(find src tests -name "*.py" | grep -v safe_load.py)

  # ============================================
  # STAGE 2: TESTING (After Quality Passes)
  # ============================================
  test:
    name: Test Suite 🧪
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils fonts-dejavu-core

      # DEVELOPMENT: Quick tests only
      - name: Run quick tests (development)
        if: github.ref == 'refs/heads/development'
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          BGBR_DISABLE_YASA: "1"
        run: |
          echo "Running unit and smoke tests..."
          uv run pytest tests/unit tests/smoke \
            -m "not integration and not benchmark and not slow and not gpu" \
            --tb=short \
            --maxfail=5 \
            -q \
            --timeout=60 \
            --timeout-method=thread

      # STAGING: Standard tests with coverage
      - name: Run standard tests (staging)
        if: github.ref == 'refs/heads/staging'
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          BGBR_DISABLE_YASA: "1"
        run: |
          echo "Running standard test suite with coverage..."
          uv run pytest tests \
            -m "not integration and not benchmark and not slow and not gpu" \
            --tb=short \
            --maxfail=10 \
            --cov=brain_go_brrr \
            --cov-report=xml \
            --cov-report=term \
            --cov-fail-under=64 \
            --timeout=60 \
            --timeout-method=thread \
            -q

      # MAIN: Full test suite with coverage
      - name: Run full tests (main)
        if: github.ref == 'refs/heads/main'
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          BGBR_DISABLE_YASA: "1"
        run: |
          echo "Running full test suite with coverage..."
          uv run pytest tests \
            -m "not integration and not benchmark and not slow and not gpu" \
            -v \
            --tb=short \
            --maxfail=10 \
            --cov=brain_go_brrr \
            --cov-report=xml \
            --cov-report=term \
            --cov-fail-under=64 \
            --timeout=60 \
            --timeout-method=thread

      # PR: Standard tests
      - name: Run PR tests
        if: github.event_name == 'pull_request'
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          BGBR_DISABLE_YASA: "1"
        run: |
          echo "Running PR test suite..."
          uv run pytest tests/unit tests/smoke \
            -m "not integration and not benchmark and not slow and not gpu" \
            --tb=short \
            --maxfail=5 \
            --timeout=60 \
            --timeout-method=thread \
            -q

      # Upload coverage for staging and main branches
      - name: Upload coverage
        if: (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main') && always()
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-ubuntu-${{ env.PYTHON_VERSION }}
          fail_ci_if_error: false  # Don't fail if upload fails

  # ============================================
  # STAGE 3: EXTENDED TESTS (Python versions - staging/main only)
  # ============================================
  test-matrix:
    name: Test Python ${{ matrix.python-version }}
    needs: test
    if: github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          BGBR_DISABLE_YASA: "1"
        run: |
          uv run pytest tests/unit tests/smoke \
            -m "not integration and not benchmark and not slow and not gpu" \
            --tb=short \
            --maxfail=5 \
            --timeout=60 \
            --timeout-method=thread \
            -q

  # ============================================
  # STAGE 4: SECURITY (Staging & Main Only)
  # ============================================
  security:
    name: Security Scan 🔒
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main'

    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'  # Don't fail the build on vulnerabilities

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: always() && github.actor != 'dependabot[bot]'
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true  # Don't fail if upload fails

  # ============================================
  # STAGE 5: INTEGRATION (Staging & Main Only)
  # ============================================
  integration:
    name: Integration Tests 🔄
    needs: test  # Security is optional, runs in parallel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main'

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run integration tests
        env:
          REDIS_URL: redis://localhost:6379
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          BGBR_DISABLE_YASA: "1"
        run: |
          uv run pytest tests \
            -m "integration" \
            --run-integration \
            -v \
            --tb=short \
            --timeout=120 \
            --timeout-method=thread

  # ============================================
  # STAGE 6: BENCHMARKS (Main Only)
  # ============================================
  benchmarks:
    name: Performance Benchmarks 📊
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need history for comparison

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run benchmarks
        env:
          CI_BENCHMARKS: "0"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          BGBR_DISABLE_YASA: "1"
        run: |
          uv run pytest tests/benchmarks \
            -m "not gpu" \
            --benchmark-json=benchmark_results.json \
            --benchmark-autosave \
            --tb=short \
            --timeout=180 \
            --timeout-method=thread || true

      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'pytest'
          output-file-path: benchmark_results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true

  # ============================================
  # STAGE 7: BUILD & DEPLOY (Main Only)
  # ============================================
  build:
    name: Build & Package 📦
    needs: [test, test-matrix]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Build package
        run: |
          uv build
          ls -la dist/

      - name: Build documentation
        run: |
          uv sync --all-extras
          make docs || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # ============================================
  # FINAL: Status Check
  # ============================================
  ci-status:
    name: CI Status ✅
    runs-on: ubuntu-latest
    needs: [quality, test]
    if: always()

    steps:
      - name: Check CI Status
        run: |
          if [[ "${{ needs.quality.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "❌ CI Failed"
            echo "Quality: ${{ needs.quality.result }}"
            echo "Test: ${{ needs.test.result }}"
            exit 1
          fi
          echo "✅ CI Passed"
