name: CI/CD Pipeline

on:
  push:
    branches: [main, staging, development, 'refactor/**', 'feature/**']
  pull_request:
    branches: [main, staging, development]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

env:
  PYTHON_VERSION: "3.11"
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: 1
  BGBR_DISABLE_YASA: 1

jobs:
  # ============================================
  # STAGE 1: QUALITY GATES (Always Run, Fail Fast)
  # ============================================
  quality:
    name: Code Quality ✨
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      
      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: uv sync --frozen
      
      - name: Pre-commit hooks
        run: |
          pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure
      
      - name: Ruff linting & formatting
        run: |
          make format-check
          make lint-ci
      
      - name: Type checking (MyPy)
        run: make type-check || true  # Allow failures for third-party issues
      
      - name: Import smoke test
        run: |
          uv run python -c "from brain_go_brrr.domain.exceptions import BrainGoBrrrError; print('✅ All imports work')"
      
      - name: Check unsafe torch.load
        run: |
          echo "Checking for unsafe torch.load usage..."
          python .pre-commit-hooks/safe_torch_load.py $(find src tests -name "*.py" | grep -v safe_load.py)

  # ============================================
  # STAGE 2: SECURITY (Parallel with Quality)
  # ============================================
  security:
    name: Security Scan 🔒
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Skip on development for speed
    if: github.ref != 'refs/heads/development'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # ============================================
  # STAGE 3: TESTING (After Quality Passes)
  # ============================================
  test:
    name: Test Suite 🧪
    needs: quality
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    
    strategy:
      fail-fast: true
      matrix:
        # DEVELOPMENT: Minimal matrix (fast feedback)
        include:
          - os: ubuntu-latest
            python-version: "3.11"
            coverage: true
            
        # STAGING: Extended matrix
        ${{ github.ref == 'refs/heads/staging' && fromJSON('[
          {"os": "ubuntu-latest", "python-version": "3.12", "coverage": false}
        ]') || fromJSON('[]') }}
        
        # MAIN: Full matrix
        ${{ github.ref == 'refs/heads/main' && fromJSON('[
          {"os": "ubuntu-latest", "python-version": "3.12", "coverage": false},
          {"os": "ubuntu-latest", "python-version": "3.13", "coverage": false}
        ]') || fromJSON('[]') }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      
      - name: Install dependencies
        run: uv sync --all-extras
      
      - name: Install system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils fonts-dejavu-core
      
      # DEVELOPMENT: Quick tests only
      - name: Run quick tests (development)
        if: github.ref == 'refs/heads/development'
        run: |
          uv run pytest tests/unit tests/smoke \
            -m "not integration and not benchmark and not slow" \
            --tb=short \
            --maxfail=5 \
            ${{ matrix.coverage && '--cov=brain_go_brrr --cov-report=term --cov-fail-under=64' || '' }}
      
      # STAGING: Unit + API tests
      - name: Run standard tests (staging)
        if: github.ref == 'refs/heads/staging'
        run: |
          uv run pytest tests \
            -m "not integration and not benchmark" \
            --tb=short \
            ${{ matrix.coverage && '--cov=brain_go_brrr --cov-report=xml --cov-fail-under=64' || '' }}
      
      # MAIN: Full test suite
      - name: Run full tests (main)
        if: github.ref == 'refs/heads/main'
        run: |
          uv run pytest tests \
            -m "not integration" \
            -v \
            --tb=short \
            ${{ matrix.coverage && '--cov=brain_go_brrr --cov-report=xml --cov-report=html --cov-fail-under=64' || '' }}
      
      - name: Upload coverage
        if: matrix.coverage && always()
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-${{ matrix.os }}-${{ matrix.python-version }}

  # ============================================
  # STAGE 4: INTEGRATION (Staging & Main Only)
  # ============================================
  integration:
    name: Integration Tests 🔄
    needs: [quality, test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main'
    
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      
      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: uv sync --all-extras
      
      - name: Run integration tests
        env:
          REDIS_URL: redis://localhost:6379
        run: |
          uv run pytest tests \
            -m "integration" \
            --run-integration \
            -v \
            --tb=short

  # ============================================
  # STAGE 5: BENCHMARKS (PR & Main Only)
  # ============================================
  benchmarks:
    name: Performance Benchmarks 📊
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need history for comparison
      
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      
      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: uv sync --all-extras
      
      - name: Run benchmarks
        env:
          CI_BENCHMARKS: 0
        run: |
          uv run pytest tests/benchmarks \
            -m "not gpu" \
            --benchmark-json=benchmark_results.json \
            --benchmark-autosave \
            --tb=short
      
      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        if: github.ref == 'refs/heads/main'
        with:
          tool: 'pytest'
          output-file-path: benchmark_results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
      
      - name: Comment PR with benchmark
        uses: benchmark-action/github-action-benchmark@v1
        if: github.event_name == 'pull_request'
        with:
          tool: 'pytest'
          output-file-path: benchmark_results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-on-alert: true
          alert-threshold: '120%'
          fail-on-alert: true
          comment-always: true

  # ============================================
  # STAGE 6: BUILD & DEPLOY (Main Only)
  # ============================================
  build:
    name: Build & Package 📦
    needs: [test, security]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      
      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}
      
      - name: Build package
        run: |
          uv build
          ls -la dist/
      
      - name: Build documentation
        run: |
          uv sync --all-extras
          make docs
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      
      - name: Deploy docs to GitHub Pages
        if: success() && github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/_build/html

  # ============================================
  # FINAL: Status Check
  # ============================================
  ci-status:
    name: CI Status ✅
    runs-on: ubuntu-latest
    needs: [quality, test]
    if: always()
    
    steps:
      - name: Check CI Status
        run: |
          if [[ "${{ needs.quality.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "❌ CI Failed"
            echo "Quality: ${{ needs.quality.result }}"
            echo "Test: ${{ needs.test.result }}"
            exit 1
          fi
          echo "✅ CI Passed"