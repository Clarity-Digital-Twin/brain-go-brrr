# TUEV Configuration - Exact Table 13 Specifications
# Based on TUEV_UNIFIED_SPECS.md

data:
  dataset: "tuev"
  root_dir: "/mnt/c/Users/JJ/Desktop/Clarity-Digital-Twin/brain-go-brrr/data/datasets/external/tuh_eeg/TUEV/v2.0.1"
  cache_dir: "/mnt/c/Users/JJ/Desktop/Clarity-Digital-Twin/brain-go-brrr/data/cache/tuev_4s_256hz_v2"

  # CRITICAL: Must be divisible by 64 for EEGPT patches
  # Paper says ~3.9s but we need 1024 samples (4.0s) for EEGPT compatibility
  window_samples: 1024  # 4.0 seconds @ 256Hz (16 patches of 64 samples)
  sampling_rate: 256    # Target rate (resample from 250Hz)
  n_channels: 23        # Input channels (will reduce to 20)
  n_classes: 6          # SPSW, GPED, PLED, EYEM, ARTF, BCKG

  # Paper line 587: batch size 500 for TUEV
  # REDUCED FOR WSL: Using 128 to prevent OOM (can increase if stable)
  batch_size: 128  # was 500 in paper, reduced for memory safety
  num_workers: 4
  pin_memory: true

model:
  # EEGPT pretrained checkpoint
  eegpt_checkpoint: "/mnt/c/Users/JJ/Desktop/Clarity-Digital-Twin/brain-go-brrr/data/models/eegpt/pretrained/eegpt_mcae_58chs_4s_large4E.ckpt"
  freeze_backbone: true  # Linear probing only

  # Table 13 architecture (lines 606-613)
  channel_reduction:
    in_channels: 23   # TUEV channels
    out_channels: 20  # Standard 10-20 channels
    kernel_size: 1

  temporal_conv:
    kernel_size: 55   # CRITICAL: 55 for TUEV (not 15!)
    padding: 27       # Maintains size
    groups: 20        # Depthwise convolution

  dropout: 0.5        # CRITICAL: 0.5 for TUEV (not 0.25!)

  # Expected shapes (for validation)
  expected_input: [23, 1024]
  expected_after_conv: [20, 1024]
  expected_features: [16, 4, 512]  # From EEGPT encoder (16 patches of 64 samples)

training:
  n_epochs: 100

  # [Paper] line 587: learning rate 5e-4
  learning_rate: 5.0e-4
  weight_decay: 0.01

  # [Decision] NO learning rate schedule for downstream tasks
  # Paper doesn't specify schedule for TUAB/TUEV (only mentions OneCycle for pretraining)
  use_scheduler: false

  # Gradient clipping for stability
  gradient_clip: 1.0

  # Early stopping
  patience: 20
  min_delta: 0.001

metrics:
  # Paper reports these metrics (Table 3)
  primary:
    - balanced_accuracy  # Target: 0.6232 ± 0.0114
    - weighted_f1        # Target: 0.8187 ± 0.0063
    - cohen_kappa        # Target: 0.6351 ± 0.0134

  secondary:
    - confusion_matrix
    - per_class_f1
    - ied_vs_non_ied    # SPSW+GPED+PLED vs others

validation:
  # Paper line 197: "repeated each experiment three times"
  n_runs: 3
  seeds: [42, 123, 456]

  # BIOT split strategy (not LOSO!)
  split_strategy: "biot"  # Use existing train/eval split

  # Target performance from paper
  targets:
    balanced_accuracy: 0.6232
    weighted_f1: 0.8187
    cohen_kappa: 0.6351

    # Comparison to BIOT baseline
    improvement_over_biot:
      balanced_accuracy: 0.095  # +9.5%
      weighted_f1: 0.069        # +6.9%

# Channel mapping - Project uses Oz instead of Fpz for consistency
# Paper line 615 shows Fpz, but per TUEV_IMPLEMENTATION_SPEC.md we use Oz
channels:
  target_20: [
    'FP1', 'FP2',                    # Frontal polar (no FPZ)
    'F7', 'F3', 'FZ', 'F4', 'F8',    # Frontal line
    'T7', 'C3', 'CZ', 'C4', 'T8',    # Temporal/Central
    'P7', 'P3', 'PZ', 'P4', 'P8',    # Parietal
    'O1', 'OZ', 'O2'                 # Occipital (using OZ not FPZ)
  ]

  # TCP montage channels in TUEV
  tcp_23: [
    'FP1-F7', 'F7-T3', 'T3-T5', 'T5-O1',
    'FP2-F8', 'F8-T4', 'T4-T6', 'T6-O2',
    'FP1-F3', 'F3-C3', 'C3-P3', 'P3-O1',
    'FP2-F4', 'F4-C4', 'C4-P4', 'P4-O2',
    'FZ-CZ', 'CZ-PZ',
    'T3-C3', 'C3-CZ', 'CZ-C4', 'C4-T4',
    'A1-T3', 'T4-A2'
  ]

# Class definitions
classes:
  0: 'SPSW'  # Spike and Sharp Wave (epileptiform)
  1: 'GPED'  # Generalized Periodic Epileptiform Discharges
  2: 'PLED'  # Periodic Lateralized Epileptiform Discharges
  3: 'EYEM'  # Eye Movement (artifact)
  4: 'ARTF'  # Other Artifacts
  5: 'BCKG'  # Background (normal)

  # Clinical groupings
  ied_classes: [0, 1, 2]  # Interictal Epileptiform Discharges
  artifact_classes: [3, 4]
  normal_classes: [5]
