experiment:
  name: tuev_smoke_test
  description: "Quick smoke test for TUEV with frequent checkpoints"
  seed: 42

data:
  root_dir: ${BGB_DATA_ROOT}/datasets/tuev  # Fixed: removed double /edf
  cache_dir: ${BGB_DATA_ROOT}/cache/tuev_mne_v2
  batch_size: 64
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  window_duration: 4.0
  window_stride: 2.0
  sampling_rate: 256
  n_channels: 20

model:
  # TUEV script expects flat structure, not nested!
  eegpt_checkpoint: ${BGB_DATA_ROOT}/models/pretrained/eegpt_mcae_58chs_4s_large4E.ckpt
  dropout: 0.5  # TUEV uses higher dropout than TUAB

training:
  n_epochs: 1  # Just 1 epoch for smoke test
  learning_rate: 5.0e-4  # TUEV script expects learning_rate not optimizer.lr
  weight_decay: 0.05  # Match EEGPT
  weighted_loss: false  # Match EEGPT (no class weights)
  label_smoothing: 0.1  # Match EEGPT
  use_scheduler: true  # Script always uses OneCycleLR
  gradient_clip: 1.0
  save_every: 1  # Save after each epoch

logging:
  log_every_n_steps: 5
  save_top_k: 3

target_metrics:
  auroc: 0.75  # Target for TUEV
  tolerance: 0.01
