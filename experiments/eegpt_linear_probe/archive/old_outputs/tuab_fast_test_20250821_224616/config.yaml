data:
  batch_size: 1024
  cache_dir: ${BGB_DATA_ROOT}/cache/tuab_4s_final
  max_samples: 10000
  n_channels: 20
  num_workers: 0
  persistent_workers: false
  pin_memory: true
  prefetch_factor: null
  root_dir: ${BGB_DATA_ROOT}/datasets/external/tuab
  sampling_rate: 256
  window_duration: 4.0
  window_stride: 2.0
experiment:
  description: Ultra-fast test configuration for debugging
  name: tuab_fast_test
  seed: 42
logging:
  log_every_n_steps: 10
  save_top_k: 1
model:
  backbone:
    checkpoint_path: ${BGB_DATA_ROOT}/models/eegpt/pretrained/eegpt_mcae_58chs_4s_large4E.ckpt
    freeze: true
    name: eegpt
  probe:
    dropout: 0.1
    hidden_dim: 128
    n_classes: 2
    type: linear
    use_channel_adapter: false
target_metrics:
  auroc: 0.869
  tolerance: 0.005
training:
  early_stopping:
    min_delta: 0.001
    mode: max
    monitor: val_auroc
    patience: 10
  gradient_clip_val: 1.0
  max_epochs: 2
  optimizer:
    lr: 0.001
    name: AdamW
    weight_decay: 0.0001
  scheduler:
    anneal_strategy: cos
    div_factor: 25.0
    epochs: 2
    final_div_factor: 1000.0
    max_lr: 0.003
    name: OneCycleLR
    pct_start: 0.2
  val_check_interval: 1
  weighted_loss: true
