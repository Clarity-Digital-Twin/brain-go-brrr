[pytest]
# NOTE: MNE-Python imports cause pytest/coverage to hang indefinitely due to
# multiprocessing semaphore issues. We exclude MNE-importing modules from
# coverage instrumentation to prevent hangs. See .coveragerc for exclusions.
# This is a known issue with coverage + multiprocessing libraries.

# Minimum pytest version
minversion = 6.0

# Test discovery
testpaths = tests
pythonpath = src
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers (use --strict-markers to catch typos)
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    fast: marks tests as fast unit tests
    integration: marks tests as integration tests (services/pipelines)
    unit: marks tests as unit tests
    data: marks tests requiring real datasets (TUAB/TUEV/Sleep-EDF)
    synth: marks tests using synthetic data only (no real datasets needed)
    external: marks tests requiring external data or resources
    network: marks tests requiring external network or dataset access
    gpu: marks tests requiring GPU
    redis: marks tests requiring Redis connection
    benchmark: marks tests for benchmarking
    perf: marks tests as performance benchmarks
    asyncio: marks tests as asynchronous
    requires_model: marks tests requiring trained EEGPT model weights
    accuracy: marks tests validating model accuracy metrics

# Default test run configuration
addopts =
    --strict-markers
    -ra
    --tb=short
    -m "not integration and not slow and not gpu and not external"
    --durations=10
    # Disable multiprocessing in libraries to prevent hangs
    -p no:cacheprovider
    # Use importlib mode to avoid import conflicts
    --import-mode=importlib
    # Exclude archived/deprecated tests
    --ignore=tests/archive

# Do not recurse into quarantine tests (kept for reference only)
norecursedirs = tests/quarantine

# Configure asyncio mode
# asyncio_mode = auto  # Not supported in all pytest-asyncio versions
# asyncio_default_fixture_loop_scope = function  # Not supported in all pytest-asyncio versions

# Timeout to prevent hanging tests
# Default timeout for all tests (reduced for faster failure detection)
# timeout = 120
# timeout_method = thread
# Enable faulthandler for better debugging of hangs
# faulthandler_timeout = 120
# Use markers to control test selection:
# pytest -m "not slow" for fast tests
# pytest -m "integration" for integration tests

# Warning filters - ZERO TOLERANCE for our code, selective for third-party
filterwarnings =
    # Default to showing warnings, not treating as errors during refactoring
    default
    # Ignore specific third-party library warnings we can't control
    ignore::DeprecationWarning:pydantic._internal
    ignore::RuntimeWarning:numpy
    ignore::RuntimeWarning:mne
    # Ignore YASA's numpy trapz deprecation (third-party library)
    ignore:`trapz` is deprecated.*:DeprecationWarning:yasa.staging
    # Ignore sklearn version warnings from YASA's pretrained models
    ignore::sklearn.exceptions.InconsistentVersionWarning
    # Allow our intentional deprecation test to pass
    ignore::DeprecationWarning:tests.smoke.test_imports

# Output options
console_output_style = progress
junit_family = xunit2
